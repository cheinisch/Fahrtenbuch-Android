org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Längere Netzwerk-Timeouts: dl.google.com antwortet zeitweise sehr langsam, und nach
# einem Timeout sperrt Gradle das Repository für den restlichen Build.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=5
